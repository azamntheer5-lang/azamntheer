<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="عزام — منصة احترافية لمعالجة PDF و Word و Excel والصور داخل متصفحك بأمان تام" />
    <meta name="theme-color" content="#04070f" />
    <!-- Belt-and-braces cache prevention for the HTML shell, on top of the
         Cache-Control headers server.ts already sends. Vite stamps every JS
         bundle with a content hash, so the ONLY way a browser can pick up a
         new deploy is by re-fetching this file; if anything between here and
         the visitor (an intermediary proxy, an old disk cache entry) ignores
         HTTP headers, these tags are a second line of defense. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%233b82f6'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text y='.9em' font-size='70' text-anchor='middle' x='50' font-family='serif' fill='white'>ع</text></svg>" />
    <title>عـزَّام | Azzam File Processing Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
